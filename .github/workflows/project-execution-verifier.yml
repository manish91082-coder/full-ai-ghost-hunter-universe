name: project-execution-verifier

on:
  workflow_run:
    workflows: ["data-plane-ci"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: project-execution-verifier-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest completed data-plane execution for current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          API="https://api.github.com/repos/${REPO}"
          HEADERS=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10")

          MAIN_SHA="$(curl -fsSL "${HEADERS[@]}" "${API}/git/ref/heads/main" | jq -r '.object.sha')"

          RUN_SHA=""
          RUN_CONCLUSION=""
          RUN_ID=""

          for attempt in $(seq 1 12); do
            RUNS_JSON="$(curl -fsSL "${HEADERS[@]}" "${API}/actions/runs?branch=main&event=push&per_page=100")"
            RUN_SHA="$(printf '%s' "${RUNS_JSON}" | jq -r --arg sha "${MAIN_SHA}" '[.workflow_runs[] | select(.name=="data-plane-ci" and .head_sha==$sha and .status=="completed")] | sort_by(.updated_at) | last | .head_sha // empty')"
            RUN_CONCLUSION="$(printf '%s' "${RUNS_JSON}" | jq -r --arg sha "${MAIN_SHA}" '[.workflow_runs[] | select(.name=="data-plane-ci" and .head_sha==$sha and .status=="completed")] | sort_by(.updated_at) | last | .conclusion // empty')"
            RUN_ID="$(printf '%s' "${RUNS_JSON}" | jq -r --arg sha "${MAIN_SHA}" '[.workflow_runs[] | select(.name=="data-plane-ci" and .head_sha==$sha and .status=="completed")] | sort_by(.updated_at) | last | .id // empty')"

            if [ -n "${RUN_SHA}" ]; then
              break
            fi
            echo "Current main has no visible completed data-plane run yet; attempt ${attempt}/12"
            sleep 10
          done

          echo "authoritative_main_sha=${MAIN_SHA}"
          echo "verified_data_plane_run_id=${RUN_ID:-none}"
          echo "verified_data_plane_sha=${RUN_SHA:-none}"
          echo "verified_data_plane_conclusion=${RUN_CONCLUSION:-none}"

          test -n "${RUN_SHA}"
          test -n "${RUN_CONCLUSION}"
          test "${RUN_SHA}" = "${MAIN_SHA}"
          test "${RUN_CONCLUSION}" = "success"

          echo "PROJECT EXECUTION VERIFIER: GREEN"
          echo "The latest completed data-plane-ci execution is successful for the exact current main HEAD."
