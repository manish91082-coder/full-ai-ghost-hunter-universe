name: project-execution-verifier

on:
  workflow_run:
    workflows: ["data-plane-ci"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: project-execution-verifier-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest main execution state
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            RUN_SHA="${TRIGGER_SHA}"
            RUN_CONCLUSION="${TRIGGER_CONCLUSION}"
            RUN_ID="${TRIGGER_RUN_ID}"
          else
            LATEST_JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${REPO}/actions/runs?branch=main&event=push&per_page=20")"
            RUN_SHA="$(printf '%s' "${LATEST_JSON}" | jq -r '[.workflow_runs[] | select(.name=="data-plane-ci")] | .[0].head_sha // empty')"
            RUN_CONCLUSION="$(printf '%s' "${LATEST_JSON}" | jq -r '[.workflow_runs[] | select(.name=="data-plane-ci")] | .[0].conclusion // empty')"
            RUN_ID="$(printf '%s' "${LATEST_JSON}" | jq -r '[.workflow_runs[] | select(.name=="data-plane-ci")] | .[0].id // empty')"
          fi

          MAIN_SHA="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${REPO}/git/ref/heads/main" | jq -r '.object.sha')"

          echo "authoritative_main_sha=${MAIN_SHA}"
          echo "verified_data_plane_run_id=${RUN_ID:-none}"
          echo "verified_data_plane_sha=${RUN_SHA:-none}"
          echo "verified_data_plane_conclusion=${RUN_CONCLUSION:-none}"

          test -n "${RUN_SHA}"
          test -n "${RUN_CONCLUSION}"
          test "${RUN_SHA}" = "${MAIN_SHA}"
          test "${RUN_CONCLUSION}" = "success"

          echo "PROJECT EXECUTION VERIFIER: GREEN"
          echo "The latest data-plane-ci execution completed successfully for the current main HEAD."
