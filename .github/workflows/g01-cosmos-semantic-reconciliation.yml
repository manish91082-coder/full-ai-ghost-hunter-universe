name: G01 Cosmos Semantic Reconciliation

on:
  push:
    paths:
      - "scripts/reconcile_g01_cosmos.py"
      - "01_BLOCKCHAIN_UNIVERSE/data/G01_SOURCE_UNION_REGISTRY_v001.json"
      - ".github/workflows/g01-cosmos-semantic-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Materialize pinned Cosmos production source
        env:
          COSMOS_TREE_SHA: 810b0b68e4591078295ccce76205e970b3c002e5
        run: python3 scripts/materialize_g01_cosmos.py
      - name: Build semantic reconciliation queue
        run: python3 scripts/reconcile_g01_cosmos.py
      - name: Upload queue evidence
        uses: actions/upload-artifact@v4
        with:
          name: g01-cosmos-semantic-reconciliation
          path: artifacts/g01_cosmos/
